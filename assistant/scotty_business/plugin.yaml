name: scotty-business
version: 1.0.0
description: "Bounded day-one business assistant for exact Discord principals and configured Trello, GoHighLevel, and RentCast resources."
author: The Closing Room
provides_tools:
  - scotty_read
  - scotty_propose
  - scotty_approval
  - scotty_reminder
  - scotty_calculate
hooks:
  - pre_gateway_dispatch
# resolve_enabled_toolsets_for_source is registered defensively at runtime.
# It is not declared here until its name is verified against the pinned image;
# if the runtime does not offer it, toolset resolution stays bounded and
# authorization still runs in pre_gateway_dispatch.
