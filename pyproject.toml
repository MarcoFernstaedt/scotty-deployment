[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
# Synthetic keyword literals in tests are fixtures, never real credentials.
"tests/*.py" = ["S106", "S108", "S603"]
"tools/*.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
exclude = "^(dist|build)/"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
